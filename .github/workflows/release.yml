name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Linux Build
      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux -- --publish never

      # Windows Build
      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish never

      # macOS Build
      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish never
        env:
          # Not signed yet (no certificate)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Release Linux
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release/*.AppImage
            release/*.deb
            release/latest*.yml

      - name: Release Windows
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/latest*.yml
            release/*.blockmap

      - name: Release macOS
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest'
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
